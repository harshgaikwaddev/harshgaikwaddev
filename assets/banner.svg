<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Harsh Gaikwad, Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0b2a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#61dafb"/>
      <stop offset="50%" stop-color="#4fd1a5"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#61dafb" stop-opacity="0"/>
      <stop offset="50%" stop-color="#61dafb"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="typed">
      <rect x="70" y="170" height="56" width="0">
        <animate attributeName="width" values="0;460;460;0" keyTimes="0;0.4;0.92;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- floating glow orbs -->
  <circle cx="180" cy="60" r="90" fill="#61dafb" opacity="0.08">
    <animate attributeName="cx" values="180;260;180" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="60;100;60" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="280" r="110" fill="#a78bfa" opacity="0.08">
    <animate attributeName="cx" values="1000;920;1000" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="280;240;280" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- floating code symbols -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="28" fill="#61dafb" opacity="0.18">
    <text x="520" y="70">&lt;/&gt;
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="640" y="290">{ }
      <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="290">=&gt;
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="7s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- text block -->
  <text x="70" y="120" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#8b949e" opacity="0">
    Hi, I'm
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.2s" fill="freeze"/>
  </text>
  <text x="70" y="168" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#ffffff" opacity="0">
    Harsh Gaikwad
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="-30 0;0 0" dur="1s" begin="0.5s" fill="freeze"/>
  </text>

  <g clip-path="url(#typed)">
    <text x="70" y="212" font-family="Consolas, 'Courier New', monospace" font-size="36" font-weight="700" fill="url(#accent)">Full-Stack Developer</text>
  </g>
  <rect x="70" y="190" width="3" height="28" fill="#61dafb">
    <animate attributeName="x" values="70;530;530;70" keyTimes="0;0.4;0.92;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- rotating stack line -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#8b949e">
    <text x="70" y="256" opacity="0">React  •  Redux Toolkit  •  Tailwind CSS
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.33;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="70" y="256" opacity="0">Node.js  •  Express  •  Flask  •  FastAPI
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.36;0.63;0.66;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="70" y="256" opacity="0">MongoDB  •  PostgreSQL  •  Redis  •  Socket.IO
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.69;0.97;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- stack diagram -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="17" text-anchor="middle">
    <g>
      <rect x="810" y="40" width="280" height="56" rx="12" fill="#0d1117" stroke="#61dafb" stroke-width="2" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="950" y="74" fill="#61dafb">Frontend · React</text>
    </g>
    <g>
      <rect x="810" y="132" width="280" height="56" rx="12" fill="#0d1117" stroke="#4fd1a5" stroke-width="2" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="950" y="166" fill="#4fd1a5">API · Node + Express</text>
    </g>
    <g>
      <rect x="810" y="224" width="280" height="56" rx="12" fill="#0d1117" stroke="#a78bfa" stroke-width="2" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="3s" begin="1s" repeatCount="indefinite"/>
      </rect>
      <text x="950" y="258" fill="#a78bfa">Database · MongoDB</text>
    </g>
  </g>

  <path d="M950 96V132M950 188V224" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 4">
    <animate attributeName="stroke-dashoffset" values="0;-16" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- data packets -->
  <circle r="5" fill="#61dafb" filter="url(#glow)">
    <animateMotion path="M950 96 V224" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#a78bfa" filter="url(#glow)">
    <animateMotion path="M966 224 V96" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- bottom animated line -->
  <rect x="0" y="312" width="1200" height="4" fill="url(#line)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
